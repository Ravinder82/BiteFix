<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiteFix - Support & Legal</title>
  <style>
    :root {
      --bg: #F4F4F5;
      --surface: #FFFFFF;
      --text: #18181B;
      --text-muted: #71717A;
      --primary: #10B981;
      --primary-hover: #059669;
      --border: #E4E4E7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 680px;
      margin: 60px auto;
      padding: 0 20px;
    }
    .hero {
      text-align: center;
      margin-bottom: 40px;
    }
    .hero h1 {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -1.2px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .hero p {
      font-size: 18px;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .card {
      background: var(--surface);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.04);
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }
    h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .link-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.1);
      transform: translateY(-1px);
    }
    .btn.primary {
      background: var(--primary);
      color: white;
      border: none;
      box-shadow: 0 8px 16px rgba(16, 185, 129, 0.25);
    }
    .btn.primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 12px 20px rgba(16, 185, 129, 0.3);
    }
    .btn-icon {
      font-size: 20px;
    }
    .icon-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .tag {
      font-size: 11px;
      font-weight: 800;
      background: rgba(16, 185, 129, 0.12);
      color: var(--primary-hover);
      padding: 5px 10px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      padding-bottom: 60px;
      color: #A1A1AA;
      font-size: 13px;
      font-weight: 600;
    }
    
    @media (max-width: 600px) {
      .container { margin: 40px auto; }
      .card { padding: 24px; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1>BiteFix</h1>
      <p>Scan. Swap. Eat Clean.</p>
    </div>

    <div class="card">
      <h2>Support & Feedback</h2>
      <div class="link-group">
        <a href="mailto:bitefixapp@gmail.com?subject=BiteFix%20Support%20Request&body=Please%20describe%20your%20issue%20or%20question%20below:%0A%0A%0A%0A---%0AApp%20Version:%202.0.0" class="btn primary">
          <div class="icon-left">
            <span class="btn-icon">📬</span>
            Contact Support
          </div>
          <span style="opacity: 0.8;">→</span>
        </a>
        <a href="mailto:bitefixapp@gmail.com?subject=BiteFix%20App%20Feedback&body=Share%20your%20thoughts,%20feature%20requests,%20or%20clean%20food%20swap%20ideas%20below:%0A%0A" class="btn">
          <div class="icon-left">
            <span class="btn-icon">💡</span>
            Send App Feedback
          </div>
          <span style="color: var(--border);">→</span>
        </a>
      </div>
    </div>

    <div class="card">
      <h2>Legal & Compliance</h2>
      <div class="link-group">
        <a href="privacy.html" class="btn">
          <div class="icon-left">
            <span class="btn-icon">🛡️</span>
            Privacy Policy
          </div>
          <span class="tag">Required</span>
        </a>
        <a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/" class="btn" target="_blank">
          <div class="icon-left">
            <span class="btn-icon">📜</span>
            Terms of Use (EULA)
          </div>
          <span class="tag">Apple Standard</span>
        </a>
      </div>
    </div>

    <footer>
      &copy; 2026 BiteFix. All rights reserved.
    </footer>
  </div>
</body>
</html>
